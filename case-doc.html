<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Case Document</title>
<!-- One John Doe v. Robert Smith case document (documents/case-flow/html/RSNN.html, the source its PDF is rendered
     from) with its dates rolled forward to the trainee's case year by js/cm-case-dates.js. The Case Flow opens
     documents here once the case has moved past 2026: case-doc.html?id=RS01&year=2029. -->
<style id="doc-css"></style>
<style>
  :root { --navy: #262B45; --orange: #F4B77A; --page: #e9ecf1; }
  html, body { background: var(--page); }
  body { margin: 0; }
  .cdv-bar { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 10px 16px; background: var(--navy); color: #fff; font: 600 14px/1.3 Arial, Helvetica, sans-serif; }
  .cdv-bar .t { flex: 1 1 260px; min-width: 0; }
  .cdv-bar .t small { display: block; font-weight: 400; font-size: 12px; color: #c9cfe0; }
  .cdv-bar button { font: 700 13px Arial, Helvetica, sans-serif; padding: 8px 12px; border: 0; border-radius: 8px; background: var(--orange); color: var(--navy); cursor: pointer; }
  .cdv-bar button.ghost { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.4); }
  .cdv-sheet { background: #fff; max-width: 8.5in; margin: 18px auto 40px; padding: 0.7in 0.75in 0.5in; box-shadow: 0 2px 12px rgba(0,0,0,.16); }
  table.cdv-page { width: 100%; border-collapse: collapse; }
  table.cdv-page > tfoot td { padding-top: 18px; }
  .cdv-turn { border-top: 1px dashed #b8bfcc; margin: 28px -0.75in; }
  .cdv-foot { display: flex; justify-content: space-between; gap: 12px; font: 7px Arial, Helvetica, sans-serif; color: #555; }
  .cdv-msg { max-width: 60ch; margin: 60px auto; padding: 0 16px; font: 15px/1.5 Arial, Helvetica, sans-serif; color: #333; }
  @media (max-width: 760px) { .cdv-sheet { margin: 0; padding: 20px 16px; box-shadow: none; } }
  @media print {
    .cdv-bar { display: none; }
    html, body { background: #fff; }
    .cdv-sheet { margin: 0; padding: 0; max-width: none; box-shadow: none; }
    .cdv-turn { border: 0; margin: 0; break-after: page; page-break-after: always; }
  }
</style>
<script>window.CM_CASE_YEAR = new URLSearchParams(location.search).get("year"); window.CM_CASE_DOL = new URLSearchParams(location.search).get("dol");   // the CMS Date of Loss offset, days</script>
<script src="/js/cm-case-flow-docs.js?v=18"></script>
<script src="/js/cm-case-dates.js?v=5"></script>
</head>
<body>
<div class="cdv-bar" id="bar" hidden>
  <div class="t" id="title"></div>
  <button id="print" type="button">Print / Save as PDF</button>
  <button id="edit" type="button" class="ghost" hidden>Download editable copy (.doc)</button>
</div>
<main id="out"><p class="cdv-msg">Loading the document…</p></main>
<script>
(async function(){
  const out = document.getElementById("out"), D = window.CM_CASE_DATES;
  const id = (new URLSearchParams(location.search).get("id") || "").toUpperCase();
  const doc = /^RS\d\d$/.test(id) && (window.CM_CF_DOCS || []).find(d => d.id === id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"})[c]);
  if(!doc || !D){ out.innerHTML = `<p class="cdv-msg">That case document wasn't found. Open it again from the Case Flow.</p>`; return; }
  let css, html;
  try{
    const [c, h] = await Promise.all(["doc.css", id + ".html"].map(f => fetch("/documents/case-flow/html/" + f).then(r => { if(!r.ok) throw new Error(r.status); return r.text(); })));
    css = c; html = D.all(h);
  }catch(e){
    out.innerHTML = `<p class="cdv-msg">The document couldn't be loaded. <a href="/documents/${doc.file.split("/").map(encodeURIComponent).join("/")}">Open the original</a>.</p>`;
    return;
  }
  document.getElementById("doc-css").textContent = css;
  document.title = `${id} ${doc.title}`;
  document.getElementById("title").innerHTML = `${esc(doc.title)}<small>John Doe v. Robert Smith · ${esc(id)} · dates current to your case (collision ${esc(D.dol())})</small>`;
  const foot = `<div class="cdv-foot"><span>LSH CASE MANAGEMENT TRAINING — SIMULATED DOCUMENT — FICTIONAL PARTIES — NOT A REAL RECORD · John Doe v. Robert Smith · ${esc(id)}</span></div>`;
  // The footer repeats on every printed page, as on the rendered PDFs: each part between the document's own page
  // breaks is a table whose footer row Chrome repeats on each page that part runs over.
  const parts = html.split('<div class="page-break"></div>');
  out.innerHTML = `<div class="cdv-sheet">${parts.map(p => `<table class="cdv-page"><tfoot><tr><td>${foot}</td></tr></tfoot><tbody><tr><td>${p}</td></tr></tbody></table>`).join('<div class="cdv-turn"></div>')}</div>`;
  document.getElementById("bar").hidden = false;
  document.getElementById("print").onclick = () => window.print();
  if(/\.docx$/i.test(doc.file)){   // the editable CMS record: a Word-readable copy with these dates
    const btn = document.getElementById("edit");
    btn.hidden = false;
    btn.onclick = () => {
      const word = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><title>${esc(doc.title)}</title><style>${css}</style></head><body>${html}</body></html>`;
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob(["﻿", word], {type: "application/msword"}));
      a.download = doc.file.split("/").pop().replace(/\.docx$/i, ".doc");
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    };
  }
})();
</script>
</body>
</html>
