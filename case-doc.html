<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Case Document</title>
<!-- One John Doe v. Robert Smith case document (documents/case-flow/html/RSNN.html, the source its PDF is rendered
     from) with its dates rolled forward to the trainee's case year by js/cm-case-dates.js. The Case Flow opens
     documents here once the case has moved past 2026: case-doc.html?id=RS01&year=2029. -->
<style id="doc-css"></style>
<style>
  :root { --navy: #262B45; --orange: #F4B77A; --page: #e9ecf1; }
  html, body { background: var(--page); }
  body { margin: 0; }
  .cdv-bar { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 10px 16px; background: var(--navy); color: #fff; font: 600 14px/1.3 Arial, Helvetica, sans-serif; }
  .cdv-bar .t { flex: 1 1 260px; min-width: 0; }
  .cdv-bar .t small { display: block; font-weight: 400; font-size: 12px; color: #c9cfe0; }
  .cdv-bar button { font: 700 13px Arial, Helvetica, sans-serif; padding: 8px 12px; border: 0; border-radius: 8px; background: var(--orange); color: var(--navy); cursor: pointer; }
  .cdv-bar button.ghost { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.4); }
  .cdv-sheet { background: #fff; max-width: 8.5in; margin: 18px auto 40px; padding: 0.7in 0.75in 0.5in; box-shadow: 0 2px 12px rgba(0,0,0,.16); }
  table.cdv-page { width: 100%; border-collapse: collapse; }
  table.cdv-page > tfoot td { padding-top: 18px; }
  .cdv-turn { border-top: 1px dashed #b8bfcc; margin: 28px -0.75in; }
  .cdv-foot { display: flex; justify-content: space-between; gap: 12px; font: 7px Arial, Helvetica, sans-serif; color: #555; }
  .cdv-file { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; flex-basis: 100%; padding: 8px 0 2px; border-top: 1px solid rgba(255,255,255,.18); }
  .cdv-file[hidden] { display: none; }
  .cdv-file select, .cdv-file input { font: 13px Arial, Helvetica, sans-serif; padding: 7px 8px; border-radius: 7px; border: 1px solid #c9cfe0; }
  .cdv-file input { flex: 1 1 320px; min-width: 0; }
  .cdv-file small { flex-basis: 100%; font-weight: 400; font-size: 12px; color: #c9cfe0; }
  .cdv-file small code { color: #fff; }
  .cdv-fmsg { flex-basis: 100%; font-weight: 400; font-size: 13px; }
  .cdv-fmsg.bad { color: #ffc9b8; } .cdv-fmsg.ok { color: #b9f0c8; }
  .cdv-fmsg ul { margin: 4px 0 0; padding-left: 18px; }
  .cdv-msg { max-width: 60ch; margin: 60px auto; padding: 0 16px; font: 15px/1.5 Arial, Helvetica, sans-serif; color: #333; }
  @media (max-width: 760px) { .cdv-sheet { margin: 0; padding: 20px 16px; box-shadow: none; } }
  @media print {
    .cdv-bar { display: none; }
    html, body { background: #fff; }
    .cdv-sheet { margin: 0; padding: 0; max-width: none; box-shadow: none; }
    .cdv-turn { border: 0; margin: 0; break-after: page; page-break-after: always; }
  }
</style>
<script>window.CM_CASE_YEAR = new URLSearchParams(location.search).get("year"); window.CM_CASE_DOL = new URLSearchParams(location.search).get("dol");   // the CMS Date of Loss offset, days</script>
<script src="/js/cm-case-flow-docs.js?v=23"></script>
<script src="/js/cm-case-dates.js?v=8"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
<div class="cdv-bar" id="bar" hidden>
  <div class="t" id="title"></div>
  <button id="pdf" type="button">⬇ Download PDF</button>
  <button id="cms" type="button" hidden>📤 File in the CMS</button>
  <button id="edit" type="button" class="ghost" hidden>Download editable copy (.doc)</button>
  <div class="cdv-file" id="filebox" hidden>
    <select id="fcat" aria-label="CMS category"><option value="">CMS category…</option></select>
    <input id="fname" aria-label="File name, the firm's way">
    <button id="fgo" type="button">File it</button>
    <small>Name it <code>&lt;Case ID&gt;_&lt;Last-First&gt;_&lt;Type&gt;_&lt;YYYY-MM-DD&gt;.&lt;ext&gt;</code>: the type is the CMS category you file it under. With no CMS open, it opens in a new tab, already signed in.</small>
    <div class="cdv-fmsg" id="fmsg" aria-live="polite"></div>
  </div>
</div>
<main id="out"><p class="cdv-msg">Loading the document…</p></main>
<script>
(async function(){
  const out = document.getElementById("out"), D = window.CM_CASE_DATES;
  const id = (new URLSearchParams(location.search).get("id") || "").toUpperCase();
  const doc = /^RS\d\d$/.test(id) && (window.CM_CF_DOCS || []).find(d => d.id === id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"})[c]);
  if(!doc || !D){ out.innerHTML = `<p class="cdv-msg">That case document wasn't found. Open it again from the Case Flow.</p>`; return; }
  let css, html, same;
  try{
    const [c, h] = await Promise.all(["doc.css", id + ".html"].map(f => fetch("/documents/case-flow/html/" + f).then(r => { if(!r.ok) throw new Error(r.status); return r.text(); })));
    css = c; html = D.all(h); same = html === h;
  }catch(e){
    out.innerHTML = `<p class="cdv-msg">The document couldn't be loaded. <a href="/documents/${doc.file.split("/").map(encodeURIComponent).join("/")}">Open the original</a>.</p>`;
    return;
  }
  document.getElementById("doc-css").textContent = css;
  document.title = `${id} ${doc.title}`;
  document.getElementById("title").innerHTML = `${esc(doc.title)}<small>John Doe v. Robert Smith · ${esc(id)} · dates current to your case (collision ${esc(D.dol())})</small>`;
  const foot = `<div class="cdv-foot"><span>LSH CASE MANAGEMENT TRAINING — SIMULATED DOCUMENT — FICTIONAL PARTIES — NOT A REAL RECORD · John Doe v. Robert Smith · ${esc(id)}</span></div>`;
  // The footer repeats on every printed page, as on the rendered PDFs: each part between the document's own page
  // breaks is a table whose footer row Chrome repeats on each page that part runs over.
  const parts = html.split('<div class="page-break"></div>');
  out.innerHTML = `<div class="cdv-sheet">${parts.map(p => `<table class="cdv-page"><tfoot><tr><td>${foot}</td></tr></tfoot><tbody><tr><td>${p}</td></tr></tbody></table>`).join('<div class="cdv-turn"></div>')}</div>`;
  document.getElementById("bar").hidden = false;
  /* ⬇ Download PDF: a file the trainee keeps and works from (their own binder, demand or exhibit set, uploaded to
     their training Drive / the CMS for the audit), never a print dialog. Dates unchanged: the original PDF itself.
     Dates rolled forward: the page as shown, rendered to a letter-size PDF here, the footer on every page. */
  const pdfName = `${id} ${doc.title}`.replace(/[—–]/g, "-").replace(/&/g, "and").replace(/[^\w .,()-]+/g, "").replace(/\s+/g, " ").trim() + ".pdf";
  const save = (blob) => { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = pdfName;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); };
  const pdfBtn = document.getElementById("pdf");
  pdfBtn.onclick = async () => {
    const label = pdfBtn.textContent; pdfBtn.disabled = true; pdfBtn.textContent = "Preparing the PDF…";
    try{
      if(same && /\.pdf$/i.test(doc.file)){
        const r = await fetch("/documents/" + doc.file.split("/").map(encodeURIComponent).join("/"));
        if(r.ok){ save(await r.blob()); return; }
      }
      if(!window.jspdf || !window.html2canvas) throw new Error("PDF tools not loaded");
      const pdf = new window.jspdf.jsPDF({unit: "pt", format: "letter"}), W = 612, H = 792, TOP = 50, BOTTOM = 46;
      const PX = 816, k = W / PX, pageH = Math.floor((H - TOP - BOTTOM) / k);   // 96 px to the inch: 816 px is 8.5in
      const stage = document.createElement("div");
      stage.style.cssText = `position:fixed;left:-10000px;top:0;width:${PX}px;background:#fff`;
      document.body.appendChild(stage);
      const footText = `LSH CASE MANAGEMENT TRAINING — SIMULATED DOCUMENT — FICTIONAL PARTIES — NOT A REAL RECORD · John Doe v. Robert Smith · ${id}`;
      let first = true;
      try{
        for(const part of parts){
          stage.innerHTML = `<div style="padding:0 72px">${part}</div>`;
          const scale = 2, cv = await window.html2canvas(stage, {scale, backgroundColor: "#ffffff", useCORS: true, windowWidth: PX});
          const slice = pageH * scale;
          for(let y = 0; y < cv.height; y += slice){
            const h = Math.min(slice, cv.height - y), c = document.createElement("canvas");
            c.width = cv.width; c.height = h; c.getContext("2d").drawImage(cv, 0, y, cv.width, h, 0, 0, cv.width, h);
            if(!first) pdf.addPage(); first = false;
            pdf.addImage(c.toDataURL("image/jpeg", 0.92), "JPEG", 0, TOP, W, h / scale * k);
            pdf.setFont("helvetica", "normal"); pdf.setFontSize(6.5); pdf.setTextColor(85);
            pdf.text(footText, 54, H - 24);
          }
        }
      }finally{ stage.remove(); }
      save(pdf.output("blob"));
    }catch(e){
      alert("The PDF couldn't be made here. Check your connection and try again.");
    }finally{ pdfBtn.disabled = false; pdfBtn.textContent = label; }
  };
  /* 📤 File in the CMS: this document filed into the trainee's own case in the CMS from here, the firm's way. The course
     page that opened this viewer (the frame's parent, or the tab's opener) holds the trainee's session, the CMS beside
     the lesson and the filing record, so it does the filing (js/cm-doc-filing.js, fileDoc) exactly as the 📤 panel does:
     the category check, the CMS's name check, the Backup Drive copy. With no CMS open, the CMS opens in a new tab in
     this click (the browser allows a tab opened by the trainee's own press), signed in with the Portal ticket. */
  const host = [window.parent !== window ? window.parent : null, window.opener].find(w => { try{ return !!(w && w.cmDocFiling && w.cmDocFiling.fileDoc); }catch(e){ return false; } }) || null;
  const cmsBtn = document.getElementById("cms"), box = document.getElementById("filebox"), fmsg = document.getElementById("fmsg");
  const fcat = document.getElementById("fcat"), fname = document.getElementById("fname"), fgo = document.getElementById("fgo");
  const say = (html, cls) => { fmsg.className = "cdv-fmsg" + (cls ? " " + cls : ""); fmsg.innerHTML = html; };
  cmsBtn.hidden = false;
  cmsBtn.onclick = () => {
    box.hidden = !box.hidden;
    if(box.hidden) return;
    if(!host){ say("Open this document from the course (📁 Work From, or 📁 Case Documents) to file it in the CMS from here.", "bad"); fgo.disabled = true; return; }
    const F = host.cmDocFiling;
    if(fcat.options.length < 2) fcat.innerHTML += F.categories.map(c => `<option>${esc(c)}</option>`).join("");
    fname.placeholder = F.namePattern(doc);
    const rec = F.record(id);
    if(rec && rec.filed) say(`Already filed in the CMS as <b>${esc(rec.name)}</b> under ${esc(rec.category)}.`, "ok");
    else if(!F.cmsReachable()) say("The CMS isn't open: pressing File it opens it in a new tab, signed in. Open your John Doe case there.");
    else say(F.caseOpen() ? `Filing into <b>${esc(F.caseOpen())}</b>, the case open in the CMS.` : "Open your own case in the CMS, then file.");
  };
  fgo.onclick = async () => {
    if(!host) return;
    const F = host.cmDocFiling, C = host.CMCase;
    if(!fcat.value){ say("Choose the CMS category you would file this document under.", "bad"); return; }
    if(!fname.value.trim()){ say("Write the file name first, the firm's way.", "bad"); return; }
    fgo.disabled = true;
    try{
      if(!F.cmsReachable()){
        const w = window.open("", "_blank");   // in the press itself, so the browser lets the tab open
        if(!w){ say("Your browser blocked the new tab. Allow pop-ups for this site, or open the CMS from 🧰 Tools, then press File it again.", "bad"); return; }
        const asked = Date.now();
        F.adoptCmsTab(w);
        say("Opening the CMS in a new tab, signed in… Open your John Doe case there; the document files as soon as the CMS says which case is open.");
        for(let t = 0; t < 120 && !(C && C.heardAt() > asked); t++) await new Promise(r => setTimeout(r, 1000));
        if(!(C && C.heardAt() > asked)){ say("The CMS hasn't said which case is open yet. Open your John Doe case in the CMS tab, then press File it again.", "bad"); return; }
      }
      say("Filing…");
      const out = await F.fileDoc(id, fcat.value, fname.value.trim());
      if(out.ok) say(`✓ Filed in the CMS as <b>${esc(out.name)}</b> under ${esc(out.category)}${out.attempts === 1 ? " · first time right" : ` · ${out.attempts} attempts`}${out.drive && out.drive.ok ? " · kept on your Backup Drive" : ""}.`, "ok");
      else say(`<b>Not filed.</b><ul>${out.problems.map(p => `<li>${esc(p)}</li>`).join("")}</ul>`, "bad");
    }finally{ fgo.disabled = false; }
  };
  if(/\.docx$/i.test(doc.file)){   // the editable CMS record: a Word-readable copy with these dates
    const btn = document.getElementById("edit");
    btn.hidden = false;
    btn.onclick = () => {
      const word = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><title>${esc(doc.title)}</title><style>${css}</style></head><body>${html}</body></html>`;
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob(["﻿", word], {type: "application/msword"}));
      a.download = doc.file.split("/").pop().replace(/\.docx$/i, ".doc");
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    };
  }
})();
</script>
</body>
</html>
