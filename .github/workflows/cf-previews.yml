# Cloudflare Worker Previews: each branch's Preview holds its own copies of the Worker's Durable Objects, and the
# account allows 500 Durable Object namespaces. Old Previews filled that, and every new Preview failed to deploy
# ("This account has reached its limit of 500 Durable Object namespaces", code 10067). So:
# - when a pull request is closed or merged, its branch's Preview is deleted;
# - "Run workflow" (Actions tab) lists every Preview and, with "delete" ticked, deletes each one whose branch has no
#   open pull request (main's is kept). Unticked, it only lists what it would delete.
# Setup: the repository secret CLOUDFLARE_API_TOKEN needs "Workers Scripts: Edit" (as well as the R2 permission
# r2-docs.yml uses). Until it has it, the run prints the API's refusal and deletes nothing.
name: Cloudflare Previews cleanup

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      delete:
        description: "Delete the Previews no open pull request needs (unticked: only list them)"
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: cf-previews
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: a5bc4befef0191374735bd6a0109fec0

jobs:
  closed:
    name: Delete the closed pull request's Preview
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Delete the Preview
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::notice::CLOUDFLARE_API_TOKEN isn't set: no Preview deleted."; exit 0; fi
          # the Preview is named after the branch (Workers Builds); a branch that never got one has nothing to delete
          npx -y wrangler@4 preview delete --name "$BRANCH" --skip-confirmation \
            || echo "::notice::No Preview deleted for $BRANCH (it may never have had one)."

  sweep:
    name: List or delete the Previews no open pull request needs
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Sweep
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/cf-previews.mjs ${{ inputs.delete && '--delete' || '' }}
