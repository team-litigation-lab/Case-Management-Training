# Runs on every pull request and every push to main. A failure shows as a red
# "Checks" status on the PR/commit with a readable log, and GitHub emails the
# person who pushed. Nothing here deploys.
name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Syntax, files and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: JavaScript syntax, local files, JSON
        run: node .github/scripts/check-site.mjs
      - name: The training modules are locked (the Case Flow's lessons and what is built from them are frozen; a change fails here on purpose)
        run: node .github/scripts/training-locked.cjs
      - name: Batch IDs are B + MMDDYY (the page and the Worker read them the same way; older codes keep working)
        run: node .github/scripts/batch-id.cjs
      - name: Single sign-on (the Portal is the only way a trainee gets in; a missing PORTAL_SSO_SECRET says so)
        run: node .github/scripts/sso.cjs
      - name: Training tools open signed in (every tool link carries a trainee's short-lived ticket; never an admin's)
        run: node .github/scripts/tool-links.cjs
      - name: Gemini key pool (every numbered key is used, keys take turns, a key out of credits rests; Google answered by the test)
        run: node .github/scripts/ai-keys.mjs
      - name: Case documents and handouts exist, document references resolve
        run: node .github/scripts/check-data.mjs
      - name: The trainee's Backup Drive (the firm's folder structure, where a filed document lands, and the Day 1 grading)
        run: node .github/scripts/cm-drive.cjs
      - name: Case Flow curriculum (rhythm, six components, 60/40 rubrics, every existing topic carried)
        run: node build/case-flow/curriculum.cjs --check
      - name: Case Flow slides (concise copy in the spec's limits, the assembled file in step)
        run: node build/case-flow/slides/assemble.cjs --check
      - name: Trainer scripts (every slide, said out loud; js/cm-case-flow-scripts.js in step)
        run: node build/case-flow/scripts/assemble.cjs --check
      - name: Case Flow simulation (an event for every activity, a call in every Case Phase, fallout, the timeline; the assembled file in step)
        run: node build/case-flow/sim/assemble.cjs --check
      - name: Case Flow exhibit audits (the draft set, the completed package, the service confirmation; the assembled file in step)
        run: node build/case-flow/exhibits/assemble.cjs --check
      - name: Defined terms capitalized as specified (build/case-flow/terms.json)
        run: node build/case-flow/terms.cjs --check
      - name: The generated files are in step with the lesson data (one rebuild changes nothing)
        run: |
          node build/case-flow/build.cjs --quiet
          if ! git diff --quiet; then
            echo "::error::A lesson edit landed without its generated files. Run 'node build/case-flow/build.cjs' and commit what it writes."
            git diff --stat
            exit 1
          fi
      - name: Case Flow dates roll forward exactly (weekdays, the two-year SOL, holidays; no date left behind)
        run: node .github/scripts/check-case-dates.mjs
      - name: Documents served from R2 (ranges, 304s, static assets as the fallback)
        run: node .github/scripts/r2-docs.mjs
      - name: Build the Worker without deploying (wrangler dry run)
        run: npx --yes wrangler@4 deploy --dry-run --outdir "$RUNNER_TEMP/dist"

  smoke:
    name: Smoke test in a browser
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/pw" playwright@1.56.1 jspdf@4.2.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Sign in, render every day, page and tool (desktop and phone)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: |
          node .github/scripts/server.mjs 8787 > "$RUNNER_TEMP/server.log" 2>&1 &
          sleep 2
          node .github/scripts/smoke.cjs http://localhost:8787/ || { echo "--- server log ---"; cat "$RUNNER_TEMP/server.log"; exit 1; }
      - name: Log Your Work takes the CMS Case ID from the CMS (the CMS answered by the test)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node .github/scripts/cms-case.cjs http://localhost:8787/ || { echo "--- server log ---"; cat "$RUNNER_TEMP/server.log"; exit 1; }
      - name: The admin side is not the trainee's (no admin log-in, view or trainer's notes for a trainee)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node .github/scripts/trainee-side.cjs http://localhost:8787/ || { echo "--- server log ---"; cat "$RUNNER_TEMP/server.log"; exit 1; }
      - name: One tools access per Practice Lab session (not on every activity row)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node .github/scripts/practice-tools.cjs http://localhost:8787/ || { echo "--- server log ---"; cat "$RUNNER_TEMP/server.log"; exit 1; }
      - name: The Knowledge Check repaints without rebuilding the page (no flicker; the bomb's fuse survives)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node .github/scripts/kc-morph.cjs http://localhost:8787/ || { echo "--- server log ---"; cat "$RUNNER_TEMP/server.log"; exit 1; }
      - name: Day cards say where the trainee is (Start, Resume, Retake with the best score, Review)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node .github/scripts/day-progress.cjs http://localhost:8787/ || { echo "--- server log ---"; cat "$RUNNER_TEMP/server.log"; exit 1; }
      - name: The Case File (the facts are the trainer's; the page fits one screen, trainee and trainer)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node .github/scripts/case-file.cjs http://localhost:8787/ || { echo "--- server log ---"; cat "$RUNNER_TEMP/server.log"; exit 1; }
      - name: Filing the case documents into the CMS, named the firm's way (the CMS answered by the test)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node .github/scripts/doc-filing.cjs http://localhost:8787/ || { echo "--- server log ---"; cat "$RUNNER_TEMP/server.log"; exit 1; }
      - name: The exhibit audit, the completed package and the Service Confirmation (the set audited, the finished set revealed, the service confirmation filed and backed up; the CMS answered by the test)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node .github/scripts/exhibit-audit.cjs http://localhost:8787/ || { echo "--- server log ---"; cat "$RUNNER_TEMP/server.log"; exit 1; }
      - name: Uploading a drafted letter in the CMS, under the right tab and the firm's convention (the CMS answered by the test)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node .github/scripts/cms-upload.cjs http://localhost:8787/ || { echo "--- server log ---"; cat "$RUNNER_TEMP/server.log"; exit 1; }
      - name: Relaying a Portal simulator's document to the CMS (the records simulator's records and bills reach the CMS beside the lesson; only the Portal may ask)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node .github/scripts/doc-relay.cjs
      - name: Presenter view (the slides window shared in Meet never flickers)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node .github/scripts/presenter.cjs http://localhost:8787/ 12 || { echo "--- server log ---"; cat "$RUNNER_TEMP/server.log"; exit 1; }
      - name: Server requests (sparing, batched, none in the background)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node .github/scripts/requests.cjs http://localhost:8787/ || { echo "--- server log ---"; cat "$RUNNER_TEMP/server.log"; exit 1; }
      - name: Graded calls from the CMS Call Simulator (read only by the trainee; the dashboard's Graded calls card)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node .github/scripts/graded-calls.cjs http://localhost:8787/ || { echo "--- server log ---"; cat "$RUNNER_TEMP/server.log"; exit 1; }
      - name: Every slide fits on one screen (laptop and large screen, every page of every day)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node .github/scripts/fit.cjs http://localhost:8787/ || { echo "--- server log ---"; cat "$RUNNER_TEMP/server.log"; exit 1; }
      - name: Every page fits one screen (the window never scrolls; a long page scrolls inside its body)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node .github/scripts/one-screen.cjs http://localhost:8787/ || { echo "--- server log ---"; cat "$RUNNER_TEMP/server.log"; exit 1; }
      - name: Blueprints (the Trainer blueprint and its PDF; the Trainee blueprint republished after every deploy)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node .github/scripts/blueprint.cjs http://localhost:8787/ || { echo "--- server log ---"; cat "$RUNNER_TEMP/server.log"; exit 1; }
