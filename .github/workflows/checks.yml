# Runs on every pull request and every push to main. A failure shows as a red
# "Checks" status on the PR/commit with a readable log, and GitHub emails the
# person who pushed. Nothing here deploys.
name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Syntax, files and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: JavaScript syntax, local files, JSON
        run: node .github/scripts/check-site.mjs
      - name: Case documents and handouts exist, document references resolve
        run: node .github/scripts/check-data.mjs
      - name: Build the Worker without deploying (wrangler dry run)
        run: npx --yes wrangler@4 deploy --dry-run --outdir "$RUNNER_TEMP/dist"

  smoke:
    name: Smoke test in a browser
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/pw" playwright@1.56.1 jspdf@4.2.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Sign in, render every day, page and tool (desktop and phone)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: |
          node .github/scripts/server.mjs 8787 > "$RUNNER_TEMP/server.log" 2>&1 &
          sleep 2
          node .github/scripts/smoke.cjs http://localhost:8787/ || { echo "--- server log ---"; cat "$RUNNER_TEMP/server.log"; exit 1; }
      - name: Presenter view (the slides window shared in Meet never flickers)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node .github/scripts/presenter.cjs http://localhost:8787/ 2 || { echo "--- server log ---"; cat "$RUNNER_TEMP/server.log"; exit 1; }
      - name: Topic dividers (one per topic, fit one page, saved places move)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node .github/scripts/dividers.cjs http://localhost:8787/ || { echo "--- server log ---"; cat "$RUNNER_TEMP/server.log"; exit 1; }
      - name: Every slide fits on one screen (laptop and large screen, every page of every day)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node .github/scripts/fit.cjs http://localhost:8787/ || { echo "--- server log ---"; cat "$RUNNER_TEMP/server.log"; exit 1; }
      - name: Blueprints (the Trainer blueprint and its PDF; the Trainee blueprint republished after every deploy)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node .github/scripts/blueprint.cjs http://localhost:8787/ || { echo "--- server log ---"; cat "$RUNNER_TEMP/server.log"; exit 1; }
