# Keeps every open pull request up to date with main, so a PR stops showing "This branch has conflicts"
# minutes after another PR merges. On each push to main (and on "Run workflow"), for every open PR from a
# branch of this repository into main, it brings main in with .github/scripts/merge-main.mjs (which rebuilds
# the generated files and settles script lists itself) and pushes the merge commit to the PR branch.
# When a real conflict or a failing check is left, it pushes nothing and leaves one comment on the PR per
# main commit, naming the files and the command to run. It never force-pushes, never touches main and never
# acts on a PR from a fork. Put the label "no-auto-update" on a PR to leave it alone.
# Pushes made with GITHUB_TOKEN start no workflows, so the Checks for the new head are started by hand
# (checks.yml has workflow_dispatch).
name: Update PR branches

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: update-branches
  cancel-in-progress: false

jobs:
  update:
    name: Bring main into open PRs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Merge main into each open PR branch
        run: |
          git fetch -q origin main
          git switch -q --detach origin/main
          MAIN_SHA=$(git rev-parse origin/main)
          export MERGE_MAIN_REF=origin/main
          # main's copy of the helper, so an old branch with an older (or no) merge-main still gets today's
          HELPER="$RUNNER_TEMP/merge-main.mjs"
          git show origin/main:.github/scripts/merge-main.mjs > "$HELPER"
          # one line per PR: number, head branch, head repository, base branch, labels
          gh api --paginate "repos/$REPO/pulls?state=open&per_page=100" \
            --jq '.[] | [.number, .head.ref, (.head.repo.full_name // "-"), .base.ref, ([.labels[].name] | join(","))] | @tsv' > "$RUNNER_TEMP/prs.tsv"
          while IFS=$'\t' read -r -u 3 PR BRANCH HEAD_REPO BASE LABELS; do
            [ "$BASE" = main ] || continue
            [ "$HEAD_REPO" = "$REPO" ] || { echo "#$PR: from a fork, skipped"; continue; }
            case ",$LABELS," in *,no-auto-update,*) echo "#$PR: labelled no-auto-update, skipped"; continue;; esac
            echo; echo "=== #$PR $BRANCH"   # (no ::group::, the checks print their own)
            git fetch -q origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH" || continue
            if git merge-base --is-ancestor origin/main "origin/$BRANCH"; then echo "#$PR: already up to date"; continue; fi
            git switch -q -C "$BRANCH" "origin/$BRANCH"
            set +e
            node "$HELPER" --ci < /dev/null 2>&1 | tee "$RUNNER_TEMP/out.txt"
            CODE=${PIPESTATUS[0]}
            set -e
            if [ "$CODE" = 0 ]; then
              # no force: if the session pushed meanwhile the push is refused, and the next push to main retries
              if git push -q origin "HEAD:refs/heads/$BRANCH"; then
                gh workflow run checks.yml --ref "$BRANCH" || echo "::warning::#$PR: could not start Checks"
                echo "#$PR: main merged and pushed"
              else
                echo "#$PR: branch moved while merging; left for the next run"
              fi
            else
              git merge --abort 2>/dev/null || true
              git reset -q --hard "origin/$BRANCH"; git clean -qfd
              # the files to resolve: the --ci "CONFLICTS: a,b" line, else the "  • file" list
              FILES=$(sed -n 's/^CONFLICTS: *//p' "$RUNNER_TEMP/out.txt" | tr ',' '\n' | sed 's/^ *//;s/ *$//' | grep -v '^$' || true)
              [ -n "$FILES" ] || FILES=$(sed -n 's/^ *• *//p' "$RUNNER_TEMP/out.txt" || true)
              MARKER="<!-- auto-update:$MAIN_SHA -->"
              if gh api --paginate "repos/$REPO/issues/$PR/comments" --jq '.[].body' | grep -F "$MARKER" > /dev/null; then
                echo "#$PR: already told about main ${MAIN_SHA:0:7}"
              else
                {
                  echo "$MARKER"
                  if [ -n "$FILES" ]; then
                    echo "main (${MAIN_SHA:0:7}) could not be merged into \`$BRANCH\` by itself. These files conflict and need a hand resolution:"
                    echo; echo "$FILES" | sed 's/^/- `/; s/$/`/'
                  else
                    echo "main (${MAIN_SHA:0:7}) merges into \`$BRANCH\`, but a check failed after the merge, so nothing was pushed. See the [run log]($GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID)."
                  fi
                  echo; echo "On this branch, run \`node .github/scripts/merge-main.mjs\`, resolve or fix what it reports, commit and push."
                  echo; echo "---"; echo "_Generated by [Claude Code](https://claude.ai/code)_"
                } > "$RUNNER_TEMP/comment.md"
                gh api "repos/$REPO/issues/$PR/comments" -F "body=@$RUNNER_TEMP/comment.md" > /dev/null || echo "::warning::#$PR: could not comment"
                echo "#$PR: commented (exit $CODE)"
              fi
            fi
            git switch -q --detach origin/main
          done 3< "$RUNNER_TEMP/prs.tsv"
