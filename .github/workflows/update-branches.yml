# Keeps every open pull request up to date with main, so a PR stops showing "This branch has conflicts"
# minutes after another PR merges. On each push to main (and on "Run workflow"), for every open PR from a
# branch of this repository into main, it brings main in with .github/scripts/merge-main.mjs (which rebuilds
# the generated files and settles script lists itself) and pushes the merge commit to the PR branch.
# When it cannot (a real conflict, a failing build or check, or main's own workflow files, which GitHub never
# lets this workflow's token push), it pushes nothing and keeps ONE comment on the PR (marked
# <!-- auto-update -->, edited in place on every later run) saying why and what to run; once a later run
# merges cleanly, that comment says the branch is up to date. It never force-pushes, never touches main and
# never acts on a PR from a fork. Put the label "no-auto-update" on a PR to leave it alone.
# Pushes made with GITHUB_TOKEN start no workflows, so the Checks for the new head are started by hand
# (checks.yml has workflow_dispatch).
name: Update PR branches

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: update-branches
  cancel-in-progress: false

jobs:
  update:
    name: Bring main into open PRs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Merge main into each open PR branch
        run: |
          git fetch -q origin main
          # main pinned for the whole run: the helper merges exactly this commit and fetches nothing itself
          MAIN_SHA=$(git rev-parse origin/main); SHORT=${MAIN_SHA:0:7}
          export MERGE_MAIN_REF="$MAIN_SHA" MERGE_MAIN_NAME="main ($SHORT)"
          git switch -q --detach "$MAIN_SHA"
          # main's copy of the helper, so an old branch with an older (or no) merge-main still gets today's
          HELPER="$RUNNER_TEMP/merge-main.mjs"
          git show "$MAIN_SHA:.github/scripts/merge-main.mjs" > "$HELPER"
          MARKER='<!-- auto-update -->'
          BOT='github-actions[bot]'
          # this workflow's one comment on a PR: its id and body ("" if none)
          ours() { gh api --paginate "repos/$REPO/issues/$1/comments" --jq ".[] | select(.user.login == \"$BOT\" and (.body | startswith(\"$MARKER\"))) | .id" | sed -n 1p; }
          # put the body in $2 in this workflow's comment on PR $1: edited in place, or posted if there is none
          upsert() {
            local id; id=$(ours "$1" || true)
            if [ -n "$id" ]; then gh api -X PATCH "repos/$REPO/issues/comments/$id" -F "body=@$2" > /dev/null || echo "::warning::#$1: could not edit the comment"
            else gh api "repos/$REPO/issues/$1/comments" -F "body=@$2" > /dev/null || echo "::warning::#$1: could not comment"; fi
          }
          # the branch is up to date now: an earlier comment says so (none is posted when there was none)
          settled() {
            local id; id=$(ours "$1" || true); [ -n "$id" ] || return 0
            printf '%s\n%s\n' "$MARKER" "main (${SHORT}) is merged into \`$2\`: up to date ✓" > "$RUNNER_TEMP/ok.md"
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F "body=@$RUNNER_TEMP/ok.md" > /dev/null || true
          }
          # tell PR $1 (branch $2) why nothing was pushed: $3 is the reason, in Markdown
          tell() {
            {
              echo "$MARKER"
              echo "<!-- head:$4 main:$MAIN_SHA -->"
              echo "main (${SHORT}) was not merged into \`$2\` automatically: $3"
              echo
              echo "On this branch, run \`git fetch origin && node .github/scripts/merge-main.mjs\`, resolve or fix what it reports, then push. ([run log]($RUN_URL))"
              echo; echo "---"; echo "_Generated by [Claude Code](https://claude.ai/code)_"
            } > "$RUNNER_TEMP/comment.md"
            upsert "$1" "$RUNNER_TEMP/comment.md"
            echo "#$1: commented: ${3%%$'\n'*}"
          }
          # one line per PR: number, head branch, head repository, base branch, labels
          gh api --paginate "repos/$REPO/pulls?state=open&per_page=100" \
            --jq '.[] | [.number, .head.ref, (.head.repo.full_name // "-"), .base.ref, ([.labels[].name] | join(","))] | @tsv' > "$RUNNER_TEMP/prs.tsv"
          while IFS=$'\t' read -r -u 3 PR BRANCH HEAD_REPO BASE LABELS; do
            [ "$BASE" = main ] || continue
            [ "$HEAD_REPO" = "$REPO" ] || { echo "#$PR: from a fork, skipped"; continue; }
            case ",$LABELS," in *,no-auto-update,*) echo "#$PR: labelled no-auto-update, skipped"; continue;; esac
            echo; echo "=== #$PR $BRANCH"   # (no ::group::, the checks print their own)
            git fetch -q origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH" || continue
            HEAD_SHA=$(git rev-parse "origin/$BRANCH")
            if git merge-base --is-ancestor "$MAIN_SHA" "$HEAD_SHA"; then echo "#$PR: already up to date"; settled "$PR" "$BRANCH"; continue; fi
            # tried already, on this same head and this same main (a re-run): the comment stands
            ID=$(ours "$PR" || true)
            if [ -n "$ID" ] && case "$(gh api "repos/$REPO/issues/comments/$ID" --jq .body || true)" in *"<!-- head:$HEAD_SHA main:$MAIN_SHA -->"*) true;; *) false;; esac; then echo "#$PR: tried on this head and main already"; continue; fi
            # (a checkout that fails must not end the run: every PR after this one would be skipped unseen)
            if ! git switch -q -C "$BRANCH" "$HEAD_SHA"; then
              echo "::warning::#$PR: could not check out $BRANCH"
              git reset -q --hard; git clean -qfd; git switch -q --detach "$MAIN_SHA" || true
              continue
            fi
            set +e
            node "$HELPER" --ci < /dev/null > "$RUNNER_TEMP/out.txt" 2>&1
            CODE=$?
            set -e
            cat "$RUNNER_TEMP/out.txt"
            if [ "$CODE" = 0 ]; then
              if [ "$(git rev-parse HEAD)" = "$HEAD_SHA" ]; then echo "#$PR: nothing to merge"
              elif [ -n "$(git diff --name-only "$HEAD_SHA" HEAD -- .github/workflows)" ]; then
                # GITHUB_TOKEN may never push a commit that changes a workflow file: the session pushes this one
                tell "$PR" "$BRANCH" "main changes files under \`.github/workflows/\`, which GitHub does not let this workflow push (its token has no workflows permission), so the merge has to be pushed from the branch's own session." "$HEAD_SHA"
              elif git push -q origin "HEAD:refs/heads/$BRANCH" 2> "$RUNNER_TEMP/push.txt"; then
                # (no force: if the session pushed meanwhile the push is refused, and the next push to main retries)
                gh workflow run checks.yml --ref "$BRANCH" || echo "::warning::#$PR: could not start Checks"
                settled "$PR" "$BRANCH"
                echo "#$PR: main merged and pushed"
              elif grep -qiE 'workflows? permission|refusing to allow' "$RUNNER_TEMP/push.txt"; then
                cat "$RUNNER_TEMP/push.txt"
                tell "$PR" "$BRANCH" "the merge changes a workflow file, which GitHub does not let this workflow push (its token has no workflows permission)." "$HEAD_SHA"
              elif grep -qE '\[rejected\].*(non-fast-forward|fetch first)' "$RUNNER_TEMP/push.txt"; then
                echo "#$PR: the branch moved while merging; left for the next run"
              else
                # refused for another reason (branch protection, a pre-receive hook …): the PR is told, with git's words
                cat "$RUNNER_TEMP/push.txt"; echo "::warning::#$PR: the push failed"
                tell "$PR" "$BRANCH" "the merge was made but the push was refused:
          \`\`\`
          $(head -c 1500 "$RUNNER_TEMP/push.txt")
          \`\`\`" "$HEAD_SHA"
              fi
            else
              git merge --abort 2>/dev/null || true
              git reset -q --hard "$HEAD_SHA"; git clean -qfd
              case "$CODE" in
                3)
                  # the files to resolve: the --ci "CONFLICTS: a,b" line (or the list under "real conflict(s) to
                  # resolve by hand"), never any other bullet the build or the checks printed
                  FILES=$(sed -n 's/^CONFLICTS: *//p' "$RUNNER_TEMP/out.txt" | tr ',' '\n' | sed 's/^ *//;s/ *$//' | grep -v '^$' || true)
                  [ -n "$FILES" ] || FILES=$(sed -n '/real conflict(s) to resolve by hand/,/^Resolve them/s/^  • //p' "$RUNNER_TEMP/out.txt" || true)
                  if [ -n "$FILES" ]; then LIST=$(echo "$FILES" | sed 's/^/- `/; s/$/`/'); else LIST='(the run log lists them)'; fi
                  tell "$PR" "$BRANCH" "these files conflict and need a hand resolution:
          $LIST" "$HEAD_SHA" ;;
                1) tell "$PR" "$BRANCH" "it merges, but a build or a check failed after the merge (see the run log), so nothing was pushed." "$HEAD_SHA" ;;
                2) tell "$PR" "$BRANCH" "merge-main.mjs found edits in its working tree (exit 2): a fault of this workflow, not of the branch." "$HEAD_SHA" ;;
                *) tell "$PR" "$BRANCH" "merge-main.mjs stopped with exit $CODE (see the run log)." "$HEAD_SHA" ;;
              esac
            fi
            git merge --abort 2>/dev/null || true
            git reset -q --hard; git clean -qfd
            git switch -q --detach "$MAIN_SHA" || echo "::warning::#$PR: could not go back to main"
          done 3< "$RUNNER_TEMP/prs.tsv"
